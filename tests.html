<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<!-- Every page on the shared origin ships a CSP (the family security rule) —
     this one is published on GitHub Pages beside the app, so it is as much a
     page on the origin as index.html is. connect-src 'self' is for reading
     index.html and sw.js as text (the paths that halt the app cannot be run
     live), api.github.com for the CI-scorecard line, and frame-src 'self' for
     the harness iframe, whose content is then governed by index.html's own CSP.
     `style-src 'self'` is what lets theme.css load, so this page wears the same
     palette as the app. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://api.github.com; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAPTrack — Tests</title>
<style>
  /* Dev-only page: pins the web-only pure functions in index.html — the
     untrusted-input boundary (normalizeItem) and the .ics calendar generation,
     which exist on no other platform (the shared schedule math is already pinned
     by the iOS and Android suites). Loads the real app in a hidden same-origin
     iframe and calls its functions directly, so what's tested is what ships.
     Serve over http://localhost (python3 -m http.server 8011); file:// iframes
     are blocked in some browsers. Leaves nothing behind: the one test that must
     write localStorage — planting a future-schema copy to prove the halt fires —
     backs up both keys first and restores them in a finally.

     The iframe boots the real app, though, which is not nothing: on an origin
     that has signed in, the sync module would start a live Firestore session
     inside an invisible frame. Two guards, and both are needed. The iframe
     carries data-pap-tests, which index.html checks so sync never initialises in
     the harness. And the gate at the foot of this script refuses to create the
     iframe at all off localhost — GitHub Pages publishes this file next to the
     app, so "somewhere else" is a page anyone can open.
     Colours are the Midnight palette from the theme pack (dev page, hardcoded). */
  body { background: #0a0e1a; color: #e7eaf6; margin: 0;
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #838cab; font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid #262f4a; background: #121829; }
  #summary.ok  { color: #72fe84; border-color: #72fe84; }
  #summary.bad { color: #fb7874; border-color: #fb7874; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid #262f4a; vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: #72fe84; }
  tr.fail td.st { color: #fb7874; }
  tr.fail td.msg { color: #fb7874; }
  .msg { color: #838cab; font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: #838cab; border-bottom-color: #374163; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PAPTrack — Pure-Function Tests</h1>
  <p class="sub">Runs against the real <code>index.html</code> in a hidden iframe. Read-only:
    nothing is saved — and it only runs on <code>localhost</code>, where that iframe can't be
    your signed-in copy of the app.</p>
  <div id="summary">Loading app…</div>
  <table><tbody id="out"></tbody></table>
</div>
<!-- The iframe is built in script, not here: it boots the real app, so it must
     not exist until the localhost gate at the foot of this file has passed. -->

<script>
'use strict';
const TESTS = [];
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name, fn }); }
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error((note ? note + ': ' : '') + 'expected ' + e + ', got ' + a);
}
function ok(cond, note) { if (!cond) throw new Error(note || 'expected truthy'); }
/* ── The completeness floor ─────────────────────────────────────────────────
   "Everything that ran passed" is only half an answer. Nothing above counts the
   tests, so a group deleted by accident — or a `PAGES.forEach` that ends up
   iterating nothing — takes its tests out of the suite silently, and the page
   and CI both go on reporting green over whatever is left. CI checks the words
   `All N tests pass` and has never cared what N is.

   This is what makes the count itself an assertion. It is the number the suite
   registers today, so ADDING a test never fails the build; removing one does,
   which is the moment to ask whether it should have gone. Lower it deliberately
   when a test is deliberately retired. */
const EXPECTED = 95;
let w; // the app iframe's window

/* Local-midnight ISO date offset from today, matching the app's own date maths. */
function iso(offsetDays) {
  const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + offsetDays);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

group('normalizeItem — the untrusted-input boundary (backups, cloud docs, localStorage)');
t('a crafted id is scrubbed to the plain charset', () => {
  const it = w.normalizeItem({ id: 'x"><img src=q onerror=alert(1)>', name: 'Mask', replaceDays: 90, lastReplaced: iso(-10) });
  ok(/^[A-Za-z0-9_-]+$/.test(it.id), 'id is plain, got ' + JSON.stringify(it.id));
});
t('impossible and rolling-over dates are rejected, not silently shifted', () => {
  eq(w.normalizeItem({ name: 'x', lastCleaned: '2026-02-31', lastReplaced: iso(-1) }).lastCleaned, null,
    'Feb 31 must not become Mar 3');
  eq(w.normalizeItem({ name: 'x', lastCleaned: 'yesterday', lastReplaced: iso(-1) }).lastCleaned, null);
});
t('a missing lastReplaced falls back to today instead of crashing render', () => {
  eq(w.normalizeItem({ name: 'x' }).lastReplaced, iso(0));
});
t('numbers are clamped into range and junk becomes the default', () => {
  const it = w.normalizeItem({ name: 'x', stock: 5000, lowAt: -3, cleanDays: 'lots', replaceDays: 99999, lastReplaced: iso(0) });
  eq(it.stock, 999);
  eq(it.lowAt, 0);
  eq(it.cleanDays, 0);
  eq(it.replaceDays, 3650);
});
/* The bounds are a three-app contract, and this boundary is the silent one: it
   runs on every load, import and synced document, so anything the phones allow
   and this app does not is rewritten here and pushed back — the phone loses it
   too, with nothing said. Until 2026-08-22 that was every numeric field (spares
   999 -> 99, reorder-at 999 -> 20, both day fields 3650 -> 365/1095). These
   figures are the phones' own ceilings; if a phone raises one, this fails. */
t('the numeric ceilings are the ones the phones use', () => {
  eq(w.__papTestHooks.LIMITS.stock, 999, 'iOS SupplyItem.stockRange / Android MAX_STOCK');
  eq(w.__papTestHooks.LIMITS.lowAt, 999, 'same ceiling as stock, on both phones');
  eq(w.__papTestHooks.LIMITS.cleanDays, 3650, 'NumberField range on both phones');
  eq(w.__papTestHooks.LIMITS.replaceDays, 3650);
});
/* The form's HTML attributes are the fourth copy of these numbers and the one a
   refactor can't see: markup holds literals, so nothing links them to LIMITS but
   this test. A stricter attribute would stop the typing before any clamp ran. */
t('the form lets you type everything the boundary would keep', () => {
  const d = w.document, L = w.__papTestHooks.LIMITS;
  eq(Number(d.getElementById('fClean').max), L.cleanDays, 'fClean max');
  eq(Number(d.getElementById('fReplace').max), L.replaceDays, 'fReplace max');
  eq(Number(d.getElementById('fStock').max), L.stock, 'fStock max');
  eq(Number(d.getElementById('fLowAt').max), L.lowAt, 'fLowAt max');
  eq(Number(d.getElementById('fName').maxLength), L.name, 'fName maxlength');
  eq(Number(d.getElementById('fNotes').maxLength), L.notes, 'fNotes maxlength');
  for (const id of ['fClean', 'fReplace', 'fStock', 'fLowAt'])
    eq(Number(d.getElementById(id).min), 0, id + ' min');
});
t('strings are truncated to their field limits', () => {
  const it = w.normalizeItem({ name: 'n'.repeat(200), notes: 'm'.repeat(500), lastReplaced: iso(0) });
  eq(it.name.length, 60);
  eq(it.notes.length, 140);
  eq(it.name.length, w.__papTestHooks.LIMITS.name, 'and both phones cap at the same figure');
  eq(it.notes.length, w.__papTestHooks.LIMITS.notes);
});
t('normalizeItems drops non-objects and re-ids duplicates', () => {
  const list = w.normalizeItems([
    { id: 'same', name: 'A', lastReplaced: iso(0) },
    'junk', null, 42,
    { id: 'same', name: 'B', lastReplaced: iso(0) },
  ]);
  eq(list.length, 2, 'two real items survive');
  ok(list[0].id !== list[1].id, 'duplicate ids are re-issued');
});
t('a non-array is an empty list, not a throw', () => {
  eq(w.normalizeItems({ items: [] }), []);
});
/* Nothing this boundary produces may hold `undefined`. localStorage drops such a key
   silently, so a local copy looks perfect — but setDoc() walks the live object and
   Firestore rejects the WHOLE document over one of them (invalid-argument). That is
   how Sprint Velocity lost sync on 2026-08-12, off one new optional field absent from
   every copy saved before it existed. Checked by key, not by value: `x === undefined`
   passes whether the key is there or not. */
t('no record holds an undefined value, which would stop cloud sync dead', () => {
  const deepUndef = (v, path) => (v && typeof v === 'object')
    ? Object.keys(v).flatMap(k => v[k] === undefined ? [path + '.' + k] : deepUndef(v[k], path + '.' + k))
    : [];
  /* The shape that produces one: records saved before fields existed. */
  const list = w.normalizeItems([{ name: 'Old mask' }, { id: 'keep', notes: 'n' }, {}]);
  eq(deepUndef(list, 'items').join(','), '');
  eq(list.length, 3, 'and they are all still real records');
});

group('Schema 2 — history, paused, snoozed, on order');
/* Seven fields landed together on 2026-08-22 rather than one bump each: a build that
   doesn't know a field strips it, so five bumps would have meant five windows in which two
   of the three apps were halted. */
t('the new fields are always present, never undefined', () => {
  const it = w.normalizeItem({ name: 'Mask', lastReplaced: iso(0) });
  eq(it.paused, false);
  eq(it.snoozeUntil, null);
  eq(it.supplier, '');
  eq(it.orderUrl, '');
  eq(it.lastOrdered, null);
  eq(it.cost, 0);
  eq(it.history, []);
});
/* The one field a browser will FOLLOW, arriving from a synced document or a backup file
   like everything else here. Anything but absolute http(s) is dropped entirely. */
t('a reorder link that is not plain http(s) is dropped', () => {
  const url = (v) => w.normalizeItem({ name: 'x', lastReplaced: iso(0), orderUrl: v }).orderUrl;
  eq(url('javascript:alert(1)'), '');
  // The closing tag is written with an escaped slash on purpose: a literal one inside a
  // classic <script> ends the block, whatever quotes it is sitting in.
  eq(url('data:text/html,<script>alert(1)<\/script>'), '');
  eq(url('  javascript:alert(1)'), '', 'leading space must not smuggle it past');
  eq(url('/relative/path'), '');
  eq(url('https://example.com/reorder?sku=1'), 'https://example.com/reorder?sku=1');
  eq(url('http://example.com/x'), 'http://example.com/x');
  eq(url('https://example.com/' + 'x'.repeat(400)), '', 'over the length cap, so nothing');
});
t('history keeps only entries it can read, newest kept when over the cap', () => {
  const h = (list) => w.normalizeItem({ name: 'x', lastReplaced: iso(0), history: list }).history;
  eq(h([{ k: 'c', d: iso(-1) }, { k: 'zz', d: iso(-1) }, { k: 'r', d: 'nonsense' }, 'junk', null]),
    [{ k: 'c', d: iso(-1) }], 'one readable entry out of five');
  eq(h('not an array'), []);
  const many = Array.from({ length: 90 }, (_, i) => ({ k: 'c', d: iso(-i) }));
  const kept = h(many);
  eq(kept.length, w.__papTestHooks.LIMITS.history);
  eq(kept[kept.length - 1], many[many.length - 1], 'the tail is what survives — oldest dropped');
});
t('cost is money or nothing, and never negative', () => {
  const c = (v) => w.normalizeItem({ name: 'x', lastReplaced: iso(0), cost: v }).cost;
  eq(c(12.345), 12.35);
  eq(c(-5), 0);
  eq(c('abc'), 0);
  eq(c(1e9), w.__papTestHooks.LIMITS.cost);
});
/* Three states that all mean "don't bother me", deliberately not the same thing. */
t('paused leaves the counts and the chips; snoozed does not', () => {
  const base = { name: 'x', cleanDays: 1, replaceDays: 90, lastReplaced: iso(-200), stock: 0, lowAt: 1 };
  const live = w.normalizeItem(base);
  const off = w.normalizeItem({ ...base, paused: true });
  ok(w.dueToClean(live) && w.dueToReplace(live) && w.dueToReorder(live), 'the live one is due for everything');
  ok(!w.dueToClean(off) && !w.dueToReplace(off) && !w.dueToReorder(off), 'the paused one for nothing');
  const snoozy = w.normalizeItem({ ...base, snoozeUntil: iso(3) });
  ok(w.dueToClean(snoozy), 'a snooze silences reminders, it does not change what is due');
  ok(w.snoozed(snoozy) && !w.snoozed(w.normalizeItem({ ...base, snoozeUntil: iso(-1) })),
    'and a snooze that has run out is simply over');
});
t('an order rests the reorder flag until the spares go up or the window passes', () => {
  const low = { name: 'x', replaceDays: 90, lastReplaced: iso(0), stock: 0, lowAt: 1 };
  ok(w.dueToReorder(w.normalizeItem(low)), 'low and nothing ordered');
  ok(!w.dueToReorder(w.normalizeItem({ ...low, lastOrdered: iso(-3) })), 'ordered three days ago');
  ok(w.dueToReorder(w.normalizeItem({ ...low, lastOrdered: iso(-40) })), 'ordered too long ago to still be coming');
  ok(!w.onOrder(w.normalizeItem({ ...low, stock: 5, lastOrdered: iso(-3) })), 'the box arrived and was unpacked');
});
t('the average gap is the real interval, not the scheduled one', () => {
  const it = w.normalizeItem({
    name: 'x', replaceDays: 90, lastReplaced: iso(0),
    history: [{ k: 'r', d: iso(-200) }, { k: 'c', d: iso(-150) }, { k: 'r', d: iso(-100) }, { k: 'r', d: iso(0) }],
  });
  eq(w.averageReplaceGap(it), 100, 'two gaps of 100 days, and the cleaning is not one of them');
  eq(w.averageReplaceGap(w.normalizeItem({ name: 'x', lastReplaced: iso(0) })), null, 'nothing to average');
});
/* A spreadsheet reads a cell starting with = + - or @ as a FORMULA, so the free text this
   app escapes on the way to innerHTML has to be defused again on the way to a CSV. */
t('CSV cells that a spreadsheet would run are defused', () => {
  eq(w.csvCell('=cmd|calc'), `"'=cmd|calc"`);
  eq(w.csvCell('+1'), `"'+1"`);
  eq(w.csvCell('-2'), `"'-2"`);
  eq(w.csvCell('@x'), `"'@x"`);
  eq(w.csvCell('Mask'), '"Mask"', 'ordinary text is left alone');
  eq(w.csvCell('a "quoted" bit'), '"a ""quoted"" bit"');
  eq(w.csvCell(null), '""');
});

group('Profiles — one account, more than one person');
/* `pap-items` still means "the list in front of you". That is the whole design: the
   phone widgets read that key directly and neither needed a line changed, and every
   other profile's supplies sit beside it under `pap-items:<id>`. */
/* The door to the whole feature is the last entry IN this picker, so hiding the picker
   for a household of one — which is what shipped for an hour on 2026-08-22 — meant a
   first-time reader could never add a second person. The phones hide their menu on the
   same rule and keep a People row in Settings; the web has no Settings screen. */
t('the profile picker is reachable with only one person, or the feature has no door', () => {
  const sel = w.document.getElementById('profileSel');
  ok(sel, 'no profile picker in the header at all');
  eq(sel.hidden, false, 'hidden with one profile — "Manage people…" lives inside it');
  const values = [...sel.options].map((o) => o.value);
  ok(values.includes('__manage__'), 'the manage entry must be in the picker');
  ok(values.length >= 2, 'one person plus the manage entry');
});
t('a browser that has never seen profiles gets exactly one, and keeps its supplies', () => {
  const list = w.normalizeProfiles(null);
  eq(list.length, 1);
  ok(list[0].id === 'default', 'the first profile keeps the id the cloud path depends on');
});
t('a corrupt profiles key is one profile, not none', () => {
  eq(w.normalizeProfiles([]).length, 1, 'an empty list would leave nowhere to put the supplies');
  eq(w.normalizeProfiles('nonsense').length, 1);
  eq(w.normalizeProfiles([{ id: '', name: 'x' }, null, 42]).length, 1);
});
/* A profile id is a localStorage key suffix AND a Firestore document id — and Firestore
   rejects a document id containing a slash, so this is not only the item-id rule. */
t('a profile id is scrubbed to the plain charset', () => {
  const list = w.normalizeProfiles([{ id: 'a/b c<>', name: 'Jamie' }]);
  eq(list[0].id, 'abc');
  eq(list[0].name, 'Jamie');
});
t('duplicate ids are dropped, not re-issued', () => {
  /* Unlike items: two profiles with one id would be two rows pointing at ONE archive
     key, so re-issuing would silently hand the second one the first one's supplies. */
  const list = w.normalizeProfiles([{ id: 'a', name: 'One' }, { id: 'a', name: 'Two' }]);
  eq(list.length, 1);
  eq(list[0].name, 'One');
});
t('names are capped and never blank', () => {
  eq(w.normalizeProfiles([{ id: 'a', name: 'n'.repeat(80) }])[0].name.length, 24);
  eq(w.normalizeProfiles([{ id: 'a', name: '   ' }])[0].name, 'Untitled');
});
t('the list is capped, so one key cannot grow without limit', () => {
  const many = Array.from({ length: 30 }, (_, i) => ({ id: 'p' + i, name: 'P' + i }));
  eq(w.normalizeProfiles(many).length, 8);
});
/* The cloud half of "don't disturb the common case": the first profile keeps writing to
   the document every build of every app has always used. Read as text — the suite must
   not open a Firestore session to find out. */
t('the first profile still syncs to the path older builds read', async () => {
  /* Fetched here rather than read off APP_SRC: that is filled in by the service-worker
     group further down, and a test that runs before it would be checking an empty
     string — which passes nothing and fails everything, depending on the assertion. */
  const code = stripComments(await (await fetch('index.html')).text());
  ok(/id === 'default'[\s\S]{0,80}F\.doc\(db, 'paptrack', user\.uid\)/.test(code),
    "the first profile must keep /paptrack/{uid}, or an older build finds an empty document");
  ok(/F\.doc\(db, 'paptrack', user\.uid, 'profiles', id\)/.test(code),
    'and the others must go to the subcollection');
  ok(/window\.paptrackProfileChanged/.test(code),
    'switching profile must restart sync — the document it was listening to is the other one');
});
/* The rules file is the other half of that path, and Firestore rules do NOT cascade into
   a subcollection: without its own match block, every extra profile's write is refused. */
t('the checked-in rules cover the subcollection the app writes', async () => {
  const rules = await (await fetch('firestore.rules')).text();
  ok(/match \/paptrack\/\{uid\}\/profiles\/\{profileId\}/.test(rules),
    'the profiles path has no rule, so an extra profile could never sync');
  ok(/request\.auth\.uid == uid/.test(rules.split('profiles/{profileId}')[1] || ''),
    'and it must compare the uid, or one account could read another\u2019s profiles');
});

group('escICS / foldICS — RFC 5545 text rules');
t('backslash, semicolon, comma, and newlines are escaped', () => {
  eq(w.escICS('a;b,c\\d\r\ne'), 'a\\;b\\,c\\\\d\\ne');
});
t('long lines fold at 75 octets with a space continuation', () => {
  const folded = w.foldICS('SUMMARY:' + 'X'.repeat(200));
  const physical = folded.split('\r\n');
  ok(physical.length > 1, 'the line folded');
  for (const line of physical)
    ok(new TextEncoder().encode(line).length <= 75, 'physical line over 75 octets: ' + line.length + ' chars');
  ok(physical.slice(1).every(l => l.startsWith(' ')), 'continuations start with a space');
  eq(physical[0] + physical.slice(1).map(l => l.slice(1)).join(''), 'SUMMARY:' + 'X'.repeat(200),
    'unfolding reproduces the original');
});
t('folding never splits a multi-byte character (emoji survive)', () => {
  const folded = w.foldICS('SUMMARY:' + '😀'.repeat(40));
  for (const line of folded.split('\r\n')) {
    const bytes = new TextEncoder().encode(line);
    ok(bytes.length <= 75, 'physical line over 75 octets');
    eq(new TextDecoder().decode(bytes), line, 'chunk survives a UTF-8 round-trip intact');
  }
});
t('a short line is returned untouched', () => {
  eq(w.foldICS('DTSTART;VALUE=DATE:20260803'), 'DTSTART;VALUE=DATE:20260803');
});

group('buildICS — which events a supply gets');
t('a scheduled item gets replace + reorder + clean events', () => {
  const ics = w.buildICS({ id: 'abc', name: 'Mask', cleanDays: 7, lastCleaned: iso(-3),
    replaceDays: 90, lastReplaced: iso(-30), stock: 2, lowAt: 1, notes: '' });
  eq((ics.match(/BEGIN:VEVENT/g) || []).length, 3);
  ok(ics.startsWith('BEGIN:VCALENDAR'), 'calendar wrapper present');
  ok(ics.includes('SUMMARY:Replace CPAP Mask'), 'replace event');
  ok(ics.includes('SUMMARY:Reorder CPAP Mask'), 'reorder event');
  ok(ics.includes('SUMMARY:Clean CPAP Mask'), 'clean event');
  const due = iso(60).replace(/-/g, '');
  ok(ics.includes('DTSTART;VALUE=DATE:' + due), 'replace lands on lastReplaced + cycle');
});
t('daily cleaning gets no calendar nagging; as-needed gets no replace/reorder', () => {
  const daily = w.buildICS({ id: 'a', name: 'Mask', cleanDays: 1, lastCleaned: iso(0),
    replaceDays: 90, lastReplaced: iso(-10), stock: 0, lowAt: 1, notes: '' });
  eq((daily.match(/SUMMARY:Clean/g) || []).length, 0);
  const asNeeded = w.buildICS({ id: 'b', name: 'Water', cleanDays: 7, lastCleaned: iso(-2),
    replaceDays: 0, lastReplaced: iso(-10), stock: 3, lowAt: 1, notes: '' });
  eq((asNeeded.match(/SUMMARY:Replace/g) || []).length, 0);
  eq((asNeeded.match(/SUMMARY:Reorder/g) || []).length, 0);
});
t('an overdue clean lands on today, never in the past', () => {
  const ics = w.buildICS({ id: 'c', name: 'Tube', cleanDays: 7, lastCleaned: iso(-30),
    replaceDays: 0, lastReplaced: iso(-10), stock: 0, lowAt: 1, notes: '' });
  ok(ics.includes('DTSTART;VALUE=DATE:' + iso(0).replace(/-/g, '')), 'clean event dated today');
});

/* The cleaning clock runs from the last wash OR the last replacement, whichever is later:
   a supply out of a fresh packet is clean, so replacing one must not leave it wearing an
   overdue badge. Pinned here as well as natively because it is the one piece of schedule
   maths that reads BOTH dates. */
group('the cleaning clock — replacing counts as clean');
t('replacing an overdue item clears its cleaning, without recording a wash', () => {
  const it = w.normalizeItem({ name: 'Mask', cleanDays: 7, lastCleaned: iso(-30), lastReplaced: iso(0) });
  eq(w.cleanDue(it), false, 'a brand-new mask is not due for cleaning');
  eq(w.cleanLeft(it), 7, 'the clock restarts at the full cycle');
  eq(it.lastCleaned, iso(-30), 'the wash log is untouched — no cleaning was invented');
  ok(!w.cleanBadge(it).includes('b-critical'), 'and the badge is not red: ' + w.cleanBadge(it));
});
t('a wash later than the replacement still wins', () => {
  const it = w.normalizeItem({ name: 'Tube', cleanDays: 7, lastCleaned: iso(-1), lastReplaced: iso(-10) });
  eq(w.cleanLeft(it), 6);
});
t('never cleaned and long since replaced is still overdue', () => {
  const it = w.normalizeItem({ name: 'Headgear', cleanDays: 7, lastCleaned: null, lastReplaced: iso(-30) });
  eq(w.cleanDue(it), true);

group('severity + labels — light echo of the natively-pinned rules');
t('the cycle − 1 clamp keeps daily cleaning good on the day it was cleaned', () => {

  eq(w.severity(90, 40), 'good');
  eq(w.severity(90, 14), 'warning');
  eq(w.severity(90, 7), 'serious');

t('agoLabel reads future dates as "in N days", not negative history', () => {

  eq(w.agoLabel(iso(0)), 'today');
  eq(w.agoLabel(iso(-1)), 'yesterday');

/* ── Offline: the service worker ────────────────────────────────────────────
   Read as TEXT rather than exercised as a live worker, and that is the point
   rather than a shortcut: the registration is frame-guarded, so this suite
   never installs one — a suite that did would be testing whatever that worker
   had cached instead of the files on disk.

   What is worth asserting is the SHAPE of the thing. Cache Storage is keyed by
   ORIGIN and shared with every sibling app, so "only files already public in
   this repo, ever" is the promise holding this up. */
group('Offline — the service worker');

let SW_SRC = '', KILL_SRC = '', APP_SRC = '';
/* Read off the app rather than repeated here, so a bump moves both together. */
const SCHEMA_KEY_NAME = 'pap-schema';
let APP_SCHEMA = 1;
const stripComments = (src) => src.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '');

t('sw.js, its kill switch and the app all read back as text', async () => {
  const [a, b, c] = await Promise.all([fetch('sw.js'), fetch('sw-kill.js'), fetch('index.html')]);
  ok(a.ok, 'sw.js is missing');
  ok(b.ok, 'sw-kill.js is missing — the escape hatch has to exist BEFORE it is needed');
  ok(c.ok, 'index.html is missing');
  SW_SRC = await a.text(); KILL_SRC = await b.text(); APP_SRC = await c.text();
  APP_SCHEMA = Number((APP_SRC.match(/const SCHEMA = (\d+);/) || [])[1]);
  ok(Number.isFinite(APP_SCHEMA), 'could not read SCHEMA out of index.html');
});

t('the cache list holds only files that are already public', () => {
  const m = SW_SRC.match(/const SHELL = \[([\s\S]*?)\]/);
  ok(m, 'could not find the SHELL list in sw.js');
  const shell = [...m[1].matchAll(/'([^']+)'/g)].map((x) => x[1]).sort();
  /* Exact equality, not "contains". A new entry has to be added here too, which
     is the moment to ask whether the file is genuinely public. The manifest and
     the three install icons joined on 2026-08-21, when the app became
     installable on a Mac or a PC: all four are committed files in this repo,
     and an installed app is the copy most likely to start with no network. */
  eq(shell, ['./', 'favicon.ico', 'icon-192.png', 'icon-512-maskable.png',
             'icon-512.png', 'manifest.webmanifest', 'privacy.html',
             'theme.css'], 'the offline shell list changed');
  for (const entry of shell)
    for (const pat of [/^tests\.html$/, /\.py$/, /CLAUDE/i, /README/i, /backup/i])
      ok(!pat.test(entry), `"${entry}" is on the shell list but must never be cached`);
});

t('the worker touches nothing cross-origin, and has no eval', () => {
  /* Guarded before the negations. Every assertion below is a NOT, and a NOT over
     an empty string passes — a file that failed to load would report green here. */
  ok(SW_SRC, 'sw.js did not load — the negations below would all pass on an empty string');
  const code = stripComments(SW_SRC);
  ok(!/https?:\/\//.test(code), 'sw.js names an off-origin URL in executable code');
  /* A worker on Pages runs with NO CSP at all, so these are not merely untidy. */
  for (const bad of ['eval(', 'importScripts(', 'new Function('])
    ok(!code.includes(bad), `sw.js uses ${bad} — it runs with no CSP, so it must not`);
});

t('the worker deletes only its own caches', () => {
  const code = stripComments(SW_SRC);
  ok(/startsWith\(PREFIX\)/.test(code), 'activate must guard caches.delete with the prefix');
  ok(/const PREFIX = 'pap-shell-';/.test(SW_SRC), 'and the prefix must be this app’s');
});

t('the worker is network-first, so cached code needs a failed network', () => {
  const code = stripComments(SW_SRC);
  ok(/Promise\.race/.test(code) && /cache\.match/.test(code), 'expected the network-first race');
  ok(!/caches\.match\(req\)\s*\.then\(\s*\(?r\)?\s*=>\s*r\s*\|\|/.test(code),
    'this looks cache-first — the whole design rests on network-first');
  ok(/!res\.ok && cached/.test(code),
    'a same-origin error reply with a cached copy in hand must serve the cache');
});

t('a missing shell file can be repaired without a new worker version', () => {
  const code = stripComments(SW_SRC);
  /* install fires ONCE per script version, so an evicted cache would never be
     rebuilt if install were the only thing that filled it. */
  ok(/addEventListener\(\s*'message'/.test(code) && /'shell-check'/.test(code),
    'the worker must accept a shell-check message');
  ok(/if \(reg\.active\) reg\.active\.postMessage\(\{ type: 'shell-check' \}\)/.test(APP_SRC),
    'and the page must ask for one on load');
  ok(!/addAll/.test(code), 'addAll rejects the whole precache on a single 404, silently');
  ok(/e\.data\.type !== 'shell-check'\) return;/.test(code),
    'the message handler must reject anything but shell-check');
  ok(!/e\.data\.(url|urls|path|cache|key)/.test(code),
    'and must never read a URL or cache name out of a message');
});

t('the kill switch stays a pure uninstaller', () => {
  const code = stripComments(KILL_SRC);
  ok(/unregister\(\)/.test(code), 'sw-kill.js must unregister itself');
  ok(!/addEventListener\(\s*'fetch'/.test(code), 'and intercept nothing — inert is the point');
  ok(!/cache\.put|addAll/.test(code), 'and never cache anything');
  ok(/startsWith\('pap-shell-'\)/.test(code), 'and clear only this app’s caches');
});

t('the page declares worker-src and guards registration three ways', () => {
  const csp = (APP_SRC.match(/http-equiv="Content-Security-Policy" content="([^"]+)"/) || [])[1] || '';
  ok(/worker-src 'self'/.test(csp),
    "the CSP must spell out worker-src 'self', not lean on the fallback chain");
  ok(!/worker-src[^;]*https?:/.test(csp), 'and admit no off-origin host there');
  ok(/window\.top !== window\.self/.test(APP_SRC),
    'registration must skip frames, or this suite would install a worker on itself');
  ok(/if \(window\.papHalted\) return;/.test(APP_SRC),
    'a page halted on newer data must install nothing');
  ok(/window\.addEventListener\('load', function \(\) \{/.test(APP_SRC),
    'and wait for load rather than compete with first paint');
});

/* ── A copy from a newer build ──────────────────────────────────────────────
   The braces to the worker's belt. normalizeItem() rebuilds every item from the
   fields it knows and drops the rest — right for a damaged backup, silently
   destructive for a copy written by a newer build, because the stripped copy
   goes back to the cloud on the next save and on to the phone apps.

   The halt is pinned as SOURCE rather than run: it draws a card over the whole
   frame and THROWS, which would take the rest of the suite with it. */
group('A copy from a newer build');

t('the marker rides in its own key, not inside the shared item list', () => {
  /* `pap-items` is a bare array, and the same data lives in a Firestore
     document the iPhone and Android apps read and write. Wrapping it to make
     room for a number would be a cross-platform format change. */
  ok(/const SCHEMA_KEY = 'pap-schema';/.test(APP_SRC), 'the marker needs its own localStorage key');
  ok(/localStorage\.setItem\(SCHEMA_KEY, String\(SCHEMA\)\)/.test(APP_SRC),
    'save() must stamp the marker beside the items');
  const save = APP_SRC.slice(APP_SRC.indexOf('function save()'), APP_SRC.indexOf('function uid()'));
  const items = save.indexOf('setItem(STORAGE_KEY');
  const marker = save.indexOf('setItem(SCHEMA_KEY');
  ok(items > -1 && marker > items,
    'the two writes must sit in the same try, so they cannot drift apart');
});

t('the cloud document carries the marker additively, for the phone apps', () => {
  /* The native apps read this document key by key and ignore what they do not
     know; when they write it back without the field it reads as 1 — older,
     never newer — so a phone write can never trip another device's halt. */
  ok(/schema: PAP_SCHEMA/.test(APP_SRC), 'pushNow must write the schema field');
  ok(/const PAP_SCHEMA = \d+;/.test(APP_SRC),
    'the sync module keeps its own copy — it cannot see the classic script’s consts');
  const appSchema = (APP_SRC.match(/const SCHEMA = (\d+);/) || [])[1];
  const modSchema = (APP_SRC.match(/const PAP_SCHEMA = (\d+);/) || [])[1];
  eq(modSchema, appSchema, 'the two constants must agree, or the document lies about its shape');
});

t('the halt fires above the current version and not at or below it', () => {
  const S = Number((APP_SRC.match(/const SCHEMA = (\d+);/) || [])[1]);
  const halts = (v) => Number(v || 1) > S;
  ok(!halts(S), 'must not halt on data this build wrote');
  ok(!halts(undefined), 'a document with no marker at all is old, not new — the phone apps write none');
  ok(halts(S + 1), 'must halt on data from a newer build');
});

t('the halt stops every write path, including sync', () => {
  /* There is no share-view flag here to reuse, so the halt sets its own — and
     it is only as good as everything that writes checking it. */
  ok(/if \(halted\) return;/.test(APP_SRC), 'save() must be a no-op once halted');
  ok(/!inTestHarness && !window\.papHalted/.test(APP_SRC),
    'the sync module must refuse to start once halted');
  ok(/window\.papHalted = true;/.test(APP_SRC), 'and the halt must set the flag the module reads');
});

t('a planted future document really does halt a fresh copy of the app', async () => {
  /* Booted for real, not pinned as source, because this is the one thing source
     inspection cannot see: the halt sets `let halted`, and with that declaration
     below the boot check the whole thing threw a temporal-dead-zone
     ReferenceError and left a BLANK PAGE instead of the card. Every string-level
     test still passed. So: plant a document from the future, load a second
     hidden copy of the app, and look at what it actually did. */
  const bkItems = localStorage.getItem('pap-items');
  const bkSchema = localStorage.getItem(SCHEMA_KEY_NAME);
  localStorage.setItem('pap-items', JSON.stringify(
    [{ id: 'future1', name: 'Mask', replaceDays: 90, lastReplaced: '2026-08-01' }]));
  localStorage.setItem(SCHEMA_KEY_NAME, String(APP_SCHEMA + 1));
  const f2 = document.createElement('iframe');
  f2.setAttribute('data-pap-tests', '');
  f2.setAttribute('aria-hidden', 'true');
  f2.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;border:0;left:-9999px';
  try {
    await new Promise((resolve) => { f2.onload = resolve; f2.src = 'index.html'; document.body.appendChild(f2); });
    const w2 = f2.contentWindow;
    ok(w2.papHalted === true, 'the halt must set papHalted — a throw on the way there leaves it undefined');
    ok(typeof w2.paptrackAdopt === 'undefined',
      'the script must abort: nothing after the halt may initialise');
    const card = w2.document.querySelector('div[style*="z-index:99999"]');
    ok(!!card, 'a card must be drawn over the app rather than a blank page');
    ok(!!card && /Newer Version/.test(card.textContent), 'and it must say why');
    ok(!!card && !!card.querySelector('button'), 'with a Reload button on it');
    const after = JSON.parse(localStorage.getItem('pap-items'));
    eq(after[0].id, 'future1', 'and the newer document must be left exactly as it was');
    eq(localStorage.getItem(SCHEMA_KEY_NAME), String(APP_SCHEMA + 1), 'marker included');
  } finally {
    f2.remove();
    if (bkItems === null) localStorage.removeItem('pap-items'); else localStorage.setItem('pap-items', bkItems);
    if (bkSchema === null) localStorage.removeItem(SCHEMA_KEY_NAME); else localStorage.setItem(SCHEMA_KEY_NAME, bkSchema);
  }
});

t('the halt flag is declared before the check that can call it', () => {
  /* The pin for the bug above, so a future edit that moves the declaration back
     down fails here rather than in a browser. */
  const flag = APP_SRC.indexOf('let halted = false;');
  const check = APP_SRC.indexOf('if (savedSchema > SCHEMA) haltForNewerData(savedSchema)');
  ok(flag > -1 && check > -1, 'the flag or the check has moved — recheck this test');
  ok(flag < check, '`let halted` must be initialised before anything can call the halt');
});

t('the boot check runs above every listener, and outside load()', () => {
  const guard = APP_SRC.indexOf('if (savedSchema > SCHEMA) haltForNewerData(savedSchema)');
  const loadFn = APP_SRC.indexOf('function load() {');
  const firstListener = APP_SRC.indexOf("addEventListener('click'");
  ok(guard > -1, 'the boot check must call haltForNewerData');
  ok(guard < loadFn, 'and must not live inside load(), whose catch returns an empty list');
  ok(firstListener === -1 || guard < firstListener,
    'the check must run before any handler is attached — the halt works by throwing');
});

t('paptrackAdopt stores the newer copy verbatim, then halts', () => {
  const at = APP_SRC.indexOf('window.paptrackAdopt =');
  const body = APP_SRC.slice(at, at + 2200);
  const guard = body.search(/Number\(schema \|\| 1\) > SCHEMA/);
  const store = body.indexOf('JSON.stringify(newItems)');
  const halt = body.indexOf('haltForNewerData(schema)');
  const norm = body.indexOf('items = normalizeItems(newItems)');
  ok(guard > -1, 'paptrackAdopt must refuse a document newer than this build');
  ok(store > guard && halt > store,
    'the newer copy must be stored VERBATIM before the halt — normalising would lose its fields');
  ok(norm > -1 && halt < norm, 'and the halt must fire before normalizeItems sees it');
  /* The schema has to actually reach it: four call sites in the sync module
     (three in startSync, one in the live listener). */
  const calls = APP_SRC.match(/paptrackAdopt\([^)]*\)/g).filter((c) => /schema/.test(c));
  ok(calls.length >= 4, 'every adopt call site must pass the document’s schema, got ' + calls.length);
});

t('another tab running a newer build is refused too', () => {
  /* Two tabs can be on different builds — one from the offline cache, one
     fetched fresh — so a newer copy arrives from next door as easily as from
     the cloud. Nothing is stored: that tab already holds the newest. */
  const at = APP_SRC.indexOf("addEventListener('storage'");
  const body = APP_SRC.slice(at, at + 1400);
  ok(/Number\(localStorage\.getItem\(SCHEMA_KEY\) \|\| 1\) > SCHEMA/.test(body),
    'the storage listener must check the marker beside the items it was handed');
  ok(body.indexOf('haltForNewerData') < body.indexOf('normalizeItems'),
    'and halt before normalizeItems strips it');
});

t('restoring a backup from a newer build is refused, without halting', () => {
  /* The backup file has carried a `version` since long before it was read. */
  const at = APP_SRC.indexOf('const parsed = JSON.parse(await file.text())');
  const body = APP_SRC.slice(at, at + 1600);
  const refuse = body.search(/Number\(\(parsed && parsed\.version\) \|\| 1\) > SCHEMA/);
  const norm = body.indexOf('normalizeItems(raw)');
  ok(refuse > -1, 'the restore handler must refuse a newer backup');
  ok(norm > -1 && refuse < norm, 'before normalizeItems strips what makes it newer');
  ok(!/haltForNewerData/.test(body), 'and must not stop the app the user is using');
  ok(/version: SCHEMA/.test(APP_SRC), 'and the backup it writes must stamp the real number');
});

/* ── Sync wiring ────────────────────────────────────────────────────────────
   The sync module is a <script type="module">, so nothing in it can be called
   from here — these are SOURCE pins, like the schema-halt group's. Both guard
   real shipped bugs, found in the 2026-08-18 audit. */
group('Sync wiring — the live listener and the sign-in push gate');

t('every attachSnapshot() call carries the !unsub guard', () => {
  /* startSync's push paths already attach the listener inside pushNow(). An
     unguarded second attach overwrites `unsub` and leaks a listener nothing
     can ever detach: doubled reads on every signed-in load, and a spurious
     "Not syncing" toast at sign-out when the orphan errors. This shipped for
     a day after the 08-17 re-attach fix — the guard is the fix. */
  const code = stripComments(APP_SRC);
  const calls = (code.match(/attachSnapshot\(\);/g) || []).length;
  const guarded = (code.match(/if \(!unsub\) attachSnapshot\(\);/g) || []).length;
  ok(calls >= 2, 'expected the startSync and pushNow call sites, got ' + calls);
  eq(guarded, calls, 'every attachSnapshot() call must be guarded by !unsub');
});

t('a push during sign-in reconciliation is deferred, then still sent', () => {
  /* An edit in the window between sign-in and the which-copy decision must not
     setDoc over the cloud copy the dialog is offering — and must not be lost
     either. The gate closes on auth change, defers instead of scheduling, and
     reconciliationDone() lifts it on success AND failure (finally), sending
     the deferred edit. */
  const gate = /if \(!reconciled\) \{ pendingLocalPush = true; return; \}/g;
  eq((APP_SRC.match(gate) || []).length, 2,
    'both cloudPush and cloudFlush must defer while reconciliation is in flight');
  ok(/reconciled = false; pendingLocalPush = false;/.test(APP_SRC),
    'the gate must close again on every auth change');
  ok(/startSync\(\)\.catch\(setSyncError\)\.finally\(reconciliationDone\)/.test(APP_SRC),
    'reconciliation must end — success or failure — by lifting the gate');
  ok(/if \(pendingLocalPush\) \{ pendingLocalPush = false; window\.cloudPush\(\); \}/.test(APP_SRC),
    'and an edit deferred behind it must be pushed once it lifts');
});

group('esc — the free-text boundary (a supply name or note reaching innerHTML)');
/* The id boundary above has had hostile-input tests since it was written. This
   one had none, in this app and three of its siblings, which an audit found on
   2026-08-20: `normalizeItem` was proved to scrub a crafted id, while `esc` —
   the function standing between a supply NAME and the card markup — was never
   called by the suite at all. A name is free text capped at 60 characters and
   a note at 140; neither is sanitized on the way in, because escaping at the
   sink is the design. So the sink is what has to be pinned.
   It matters beyond this app: every GitHub Pages site in this account shares one
   browser origin, so markup escaping here is what keeps a hole here from being a
   hole in the two apps holding work figures. */
t('every HTML-significant character is replaced', () => {
  eq(w.__papTestHooks.esc('<>&"\''), '&lt;&gt;&amp;&quot;&#39;');
});
t('a hostile name survives as text and never as markup', () => {
  const evil = '"><img src=x onerror=alert(1)><script>alert(2)<\/script>';
  const e = w.__papTestHooks.esc(evil);
  /* Parsed for real rather than string-matched: the question is what a BROWSER
     builds from this, both in an attribute (the card's aria-labels interpolate
     the name) and in text. A regex over the output would pass on markup the
     parser still accepts. */
  const probe = document.createElement('div');
  probe.innerHTML = '<span title="' + e + '">' + e + '</span>';
  eq(probe.querySelectorAll('img, script').length, 0, 'no element may be created');
  eq(probe.firstElementChild.textContent, evil, 'and the text reads back unchanged');
  eq(probe.firstElementChild.getAttribute('title'), evil, 'including inside an attribute');
});
t('null, undefined and numbers are handled, not thrown on', () => {
  eq(w.__papTestHooks.esc(null), '');
  eq(w.__papTestHooks.esc(undefined), '');
  eq(w.__papTestHooks.esc(7), '7');
});


group('Which fields raise a phone keyboard');
/* `openModal` moves focus off a text field onto the dialog on a touch screen, so
   the on-screen keyboard doesn't cover the dialog you just opened. What counts
   as "a text field" is the whole decision, and it is pure — pinned here so the
   list is a test rather than a rediscovery the next time a dialog opens on a
   field nobody thought about. Same block in Money Map and the sibling apps. */
t('a typing field does, whatever flavour', () => {
  for (const type of ['text', 'number', 'search', 'tel', 'url', 'email',
                      'password', 'date', 'month'])
    ok(w.__papTestHooks.raisesKeyboard({ tagName: 'INPUT', type }), `input[type=${type}]`);
  ok(w.__papTestHooks.raisesKeyboard({ tagName: 'TEXTAREA' }), 'a note box has no type at all');
});
t('a control you press or pick does not', () => {
  for (const type of ['checkbox', 'radio', 'button', 'submit', 'range', 'color', 'file'])
    eq(w.__papTestHooks.raisesKeyboard({ tagName: 'INPUT', type }), false, `input[type=${type}]`);
  eq(w.__papTestHooks.raisesKeyboard({ tagName: 'BUTTON' }), false);
  eq(w.__papTestHooks.raisesKeyboard({ tagName: 'SELECT' }), false);
  eq(w.__papTestHooks.raisesKeyboard({ tagName: 'DIALOG' }), false, 'the dialog itself, once focus lands there');
  eq(w.__papTestHooks.raisesKeyboard(null), false, 'nothing focused is not a keyboard');
});

group('Dependabot can see the one third-party thing this app runs');
t('package.json and the page name the SAME Firebase SDK', async () => {
  /* The one genuinely third-party thing this app runs is Google's Firebase SDK,
     and it is loaded by URL from www.gstatic.com — so until 2026-08-21 NOTHING
     was watching it. Dependabot only reads manifests, and there was no manifest
     naming it; the clean bill of health it reported covered nothing at all.

     package.json is that manifest. It installs nothing (CI passes --omit=dev)
     and the bytes that run still come from Google's CDN at page load. Which
     creates the same way of ending up lying that a vendored library has:
     Dependabot cannot rewrite a URL, so a version-bump PR would raise the
     manifest while the page went on fetching the old one. Pinning the two
     together turns that PR into the right instruction — "a newer SDK exists,
     now change the URL too" — rather than a false record. */
  const [pkgRes, appRes] = await Promise.all([fetch('package.json'), fetch('index.html')]);
  ok(pkgRes.ok, 'package.json is missing — Dependabot then scans nothing at all');
  ok(appRes.ok, 'index.html is missing');
  const PKG = await pkgRes.text(), APPSRC = await appRes.text();
  const pinned = (PKG.match(/"firebase"\s*:\s*"([^"]+)"/) || [])[1];
  ok(pinned, 'package.json must declare firebase');
  ok(/^\d+\.\d+\.\d+$/.test(pinned),
    'pin it exactly — a ^ or ~ range cannot be checked against a URL: ' + pinned);
  const used = (APPSRC.match(/firebasejs\/(\d+\.\d+\.\d+)\//) || [])[1];
  ok(used, 'could not find the firebasejs URL in index.html');
  eq(used, pinned,
    'the page loads Firebase ' + used + ' but the manifest pins ' + pinned
    + ' — if this followed a Dependabot bump, the URL still has to be changed');
  const pkgObj = JSON.parse(PKG);
  eq(pkgObj.private, true, 'private:true, so it can never reach npm by accident');
  ok(!pkgObj.scripts, 'no scripts — this repo has no build step and must not grow one');
  ok(!pkgObj.dependencies, "the entry belongs in devDependencies, which CI's --omit=dev skips");
  ok(pkgObj.devDependencies && Object.keys(pkgObj.devDependencies).length === 1,
    'one entry only: the SDK the page loads by URL');
});

group('Google\u2019s code is fetched when it is asked for, not on every visit');
t('the boot branch is conditional, and the flag is kept up to date', () => {
  /* The change this pins (2026-08-22): Google's code is no longer fetched on
     every visit. init() used to run unconditionally at the foot of the sync
     module, so firebase-app/auth/firestore and the sign-in client were
     downloaded before anyone had touched anything — which is what made the
     privacy policy's old wording false. Now the boot branch asks
     shouldBootSync(), and a browser that has never signed in loads nothing
     until the button is reached for.

     Read as TEXT, like the service-worker group above and for the same reason:
     the suite must not boot a real session to find out. What is worth asserting
     is the SHAPE — that the unconditional call is gone, that the flag is written
     on every auth report including the null one, and that the click path can
     still get the SDK for somebody who never hovers. */
  const code = stripComments(APP_SRC);
  ok(!/^\s*init\(\)\.catch/m.test(code),
    'init() is being called unconditionally again — that is the eager load this removed');
  ok(/function shouldBootSync\(\)/.test(code),
    'the boot decision must go through shouldBootSync()');
  ok(/if \(shouldBootSync\(\)\)/.test(code), 'and the boot branch must ask it');
  ok(/const SYNC_LIVE = 'pap-sync-live'/.test(code),
    'the flag this app records the answer in must keep its key');
  ok(/localStorage\.setItem\(SYNC_LIVE, u \? '1' : '0'\)/.test(code),
    "the flag must be written on EVERY auth report — the null one is what makes "
    + 'signing out stop the requests rather than just the syncing');
  ok(/localStorage\.getItem\(LEGACY_SYNC_UID\) !== null/.test(code),
    'a browser that signed in before this shipped must still be recognised, once, '
    + 'from the legacy pap-sync-uid marker');
  for (const ev of ['pointerenter', 'pointerdown', 'focus'])
    ok(code.includes("'" + ev + "'"),
      'the SDK is warmed on ' + ev + ', which fires before click — without it the '
      + 'sign-in popup is opened outside the gesture and browsers block it');
  ok(/async function onClick\(\)/.test(code) && /await ensureInit\(\)/.test(code),
    'and the click path must be able to load it itself, for somebody who tabs '
    + 'straight to the button and presses Enter');
  ok(/function ensureInit\(\)/.test(code) && /if \(!initPromise\)/.test(code),
    'ensureInit must be idempotent, or a hover and a click start two Firebase apps');
});

group('privacy.html — the family footer and its landmarks');
/* Added 2026-08-21. The app's own footer had carried the family lines for a
   while; this page carried none of them, and it is a public page reached by a
   link in that very footer — so somebody who followed it landed on a document
   with no way back to what it documents and no statement of who wrote it. It
   also had no <main> at all, which makes a contentinfo footer worse than none:
   the policy itself would sit in no landmark. Both went in together, matching
   every sibling app. */
/* The hosts the privacy policy has to name, so a reader can check the claim
   against a network trace. A list, because that is what the assertion below is
   really iterating — and because a bare hostname literal sitting inside an
   inline string test is what makes a scanner read a prose search as a URL
   check. See the note at the assertion. */
const HOSTS_THE_POLICY_MUST_NAME = ['gstatic', 'accounts.google.com'];
let PRIV_SRC = '';
t('the privacy page reads back as text', async () => {
  const r = await fetch('privacy.html');
  ok(r.ok, 'privacy.html is missing — the app footer links straight at it');
  PRIV_SRC = await r.text();
});
t('it carries How it works and the authorship line, but not a link to itself', () => {
  ok(/>How it works</.test(PRIV_SRC),
    'the repo link must be labelled "How it works" family-wide');
  ok(/MIT licensed/.test(PRIV_SRC), 'and the authorship line every public page has');
  ok(!/href="privacy\.html"/.test(PRIV_SRC),
    'and NOT a privacy link, which on the privacy page points at itself');
});
t('the policy sits in <main>, and the footer comes after it', () => {
  /* Comments stripped FIRST, and the footer matched by its CLASS. The notes
     beside both elements name them in prose — and one of those notes is in the
     <style> block, which an HTML-comment strip does not reach — so a bare
     /<main>/ or a bare '<footer' would pass on a page that had lost the element
     and kept the comment explaining it, which is the one way this could rot.

     Looped rather than a single .replace(): one pass over a multi-character
     delimiter can leave a NEW opener behind that the pass already went past.
     CodeQL's js/incomplete-multi-character-sanitization flags the single-pass
     form, and the same helper is in every sibling repo's suite. */
  const strip = (str) => {
    let out = String(str), prev;
    do { prev = out; out = out.replace(/<!--[\s\S]*?-->/g, ''); } while (out !== prev);
    return out;
  };
  const bare = strip(PRIV_SRC);
  ok(/<main>/.test(bare),
    'no main landmark, so contentinfo would be the only one on the page');
  ok(/<footer class="foot">/.test(bare),
    'the footer is a real <footer> — a contentinfo landmark, not a styled paragraph');
  ok(bare.indexOf('</main>') < bare.indexOf('<footer class="foot"'),
    'with main CLOSED before it: a <footer> inside main is not contentinfo at all');
});

t('the policy says WHEN Google\u2019s code loads, because it is not on sign-in', () => {
  /* The wording here has moved twice and the second move is the good one. It
     said Google's code loaded "only when you choose to sign in", which a network
     trace showed was false — it loaded on every visit. That was corrected on
     2026-08-21, and then on 2026-08-22 the APP was changed so the original,
     stronger sentence could be true: nothing of Google's is fetched until the
     sign-in button is reached for, or unless this browser already holds a
     session. So this now pins the strong claim AND the honest caveat, because a
     policy that promised "never without asking" and quietly skipped the
     already-signed-in case would be the same kind of wrong again. */
  const policySrc = PRIV_SRC;
  ok(/[Oo]nly when you ask for it/.test(policySrc),
    'the policy must say Google\u2019s code is fetched only when asked for');
  ok(/already signed in on this device/.test(policySrc),
    'and must still own the one case where it loads on its own — a browser that '
    + 'already holds a session, which is the only way staying signed in can work');
  ok(/signing out stops the requests/i.test(policySrc),
    'and say that signing out stops the requests, not just the syncing');
  /* The two hosts, as a NAMED LIST of things the prose has to mention, rather
     than a boolean over two literals. It reads as what it is — a documentation
     requirement — and it is also the shape that stops a scanner misreading it.
     Written inline, either spelling trips a URL-validation heuristic: as a
     regex it is js/regex/missing-regexp-anchor, and as .includes() it is
     js/incomplete-url-substring-sanitization. Both were reported here and in
     two sibling repos. Nothing on this line validates a URL — there is no URL,
     only a policy document being searched for a word — so neither alert was
     ever a vulnerability, and the fix is to say plainly what is being asked. */
  for (const host of HOSTS_THE_POLICY_MUST_NAME) {
    ok(policySrc.indexOf(host) !== -1,
      'the policy must name ' + host + ', so the claim is checkable against a network trace');
  }
  ok(!/loads? on (every|each) visit(?![\s\S]{0,80}until August)/i.test(policySrc),
    'the every-visit wording is back, but the app no longer does that — one of '
    + 'the two is now wrong');
});

/* The chip hover is a two-specificity selector and so is the pressed rule, so the tie
   between them goes to whichever is written last. Written after, `.filter-chip:hover`

   the filter silently looks switched off while it is still on. Source order is the whole
   guard, so source order is what this pins. */
t('the chip hover cannot repaint a pressed chip', () => {
  const hover = APP_SRC.indexOf('.filter-chip:hover {');

  ok(pressed > -1, 'the pressed chip still has its own rule');
  ok(hover < pressed, 'the plain hover must be declared BEFORE the pressed rule');
  ok(APP_SRC.includes('.filter-chip[aria-pressed="true"]:hover'),
    'a pressed chip needs a hover of its own — it is filled, so a border tell is invisible');
});

/* Two things live in one `minmax()` on `.list`, and both read like arithmetic that
   could be tidied away. The 660px floor is MEASURED: it is the narrowest card that
   keeps a status badge on one line, so the row loses a column exactly when the pills
   would otherwise wrap. Wrapped inside `min(660px, 100%)` for the phone, because a
   minmax MINIMUM is not a suggestion — a bare 660px lays out a 660px column on a
   375px screen and scrolls the whole page sideways. `max(..., (100% - 24px) / 3)` is
   the ceiling: without it auto-fill puts five cards in a row at the 2400px page
   width. The 24px is the two gaps a three-column row carries and has to match the
   `gap`. */
t('the card grid keeps its badge floor and its three-column ceiling', () => {
  const rule = (APP_SRC.match(/\.list \{[^}]*\}/) || [''])[0];

  ok(/calc\(\(100% - 24px\) \/ 3\)/.test(rule), 'three columns is the ceiling at any page width');
  ok(/max\(/.test(rule), 'the two terms are combined with max(), so the larger one wins');
  const gap = (rule.match(/gap: (\d+)px/) || [])[1];
  eq(String(Number(gap) * 2), '24', 'the 24px in the cap is the two gaps in a three-column row');
});

/* ── Runner ───────────────────────────────────────────────────────────────── */

/* The localhost gate. Booting the app is itself the side effect worth guarding:
   on the published origin the iframe would be a real, signed-in copy, and
   onAuthStateChanged would start a Firestore session — or raise the "another
   device cleared its supplies" dialog — inside a frame nobody can see. So the
   check comes before the iframe exists, not inside its load handler.

   file:// has no hostname, and its '' is deliberately NOT in this list. It
   used to be, and that sent file:// down the iframe branch — where the frame
   silently fails to load (browsers block file:// iframes) and the suite blamed
   the app. Left out, file:// falls through to the else below, whose file://
   wording is the advice that actually fixes it. */
const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]'];

if (LOCAL_HOSTS.includes(location.hostname)) {
  const frame = document.createElement('iframe');
  frame.id = 'app';
  frame.title = 'app under test';
  /* index.html checks for this and leaves the sync module uninitialised. */
  frame.setAttribute('data-pap-tests', '');
  frame.setAttribute('aria-hidden', 'true');
  frame.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
  frame.addEventListener('load', () => setTimeout(run, 150), { once: true }); // let boot finish
  frame.src = 'index.html';           /* set before append: one load event, the real one */
  document.body.appendChild(frame);
} else {
  const s = document.getElementById('summary');
  s.className = 'bad';
  /* Two reasons to be here, needing different sentences: a published copy
     (where booting the app would touch real, signed-in data) and a file://
     copy off disk (where it simply cannot work — browsers block file://
     iframes). Both end at the same instruction. */
  const onDisk = location.protocol === 'file:';
  s.textContent = onDisk
    ? 'Not run from a file — this page needs a local server.'
    : 'Not run here — this page boots a live copy of the app.';
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:13px;line-height:1.6';
  td.innerHTML = (onDisk
    ? 'The suite loads the app in a hidden frame to test it, and a browser blocks that '
      + 'frame when the page is opened straight off disk — so the tests would have nothing '
      + 'to run against. Serve the folder instead:'
    : 'The suite loads the app in a hidden frame to test it. On <strong></strong> '
      + 'that frame would be your real, signed-in copy, quietly starting a sync session where '
      + 'you can\'t see it. It runs on <code>localhost</code> only, against a copy served from '
      + 'the repo folder:') +
    '<br><br><code>cd ~/claude-paptrack &amp;&amp; ' +
    'python3 -m http.server 8011</code><br>then open ' +
    '<code>http://localhost:8011/tests.html</code>.<br><br>' +
    'Nothing has been changed by opening this page — <a href="index.html">back to the app</a>.';
  if (!onDisk) td.querySelector('strong').textContent = location.hostname;
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);
  /* Only where the suite itself can't run: on localhost the CI row would sit
     above the live results — and CI's scraper counts every tr.fail on the page,
     so a red *previous* run rendered here could fail a green suite. */
  showLatestRun();
}


/* ── The scorecard, where the suite itself can't run ─────────────────────────
   Refusing to run and then saying nothing about whether the tests pass is half
   an answer: the question someone opens this page to ask is "is it green?".
   The same suite runs headless in CI on every push, so ask GitHub how that went
   and show it here. Nothing is booted and nothing is stored — it is one public,
   unauthenticated read of a workflow's run list.
─────────────────────────────────────────────────────────────────────────── */
function showLatestRun() {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:14px;line-height:1.6;padding:12px 16px';
  td.textContent = 'Checking the latest CI run…';
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);

  fetch('https://api.github.com/repos/eagleadams86/paptrack/actions/workflows/tests.yml/runs?branch=main&per_page=1')
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((d) => {
      const run = d && d.workflow_runs && d.workflow_runs[0];
      if (!run) { td.textContent = 'No CI runs found for this repository yet.'; return; }
      const done = run.status === 'completed';
      const okRun = run.conclusion === 'success';
      tr.className = !done ? '' : (okRun ? 'pass' : 'fail');
      const when = run.updated_at ? new Date(run.updated_at).toLocaleString() : '';
      const sha = String(run.head_sha || '').slice(0, 7);
      /* Only ever build an <a> when the API really did hand back a GitHub https
         URL — the same guard the app uses for any URL out of an API. */
      const url = String(run.html_url || '');
      td.textContent = (!done ? '⏳ The latest run is still going'
        : okRun ? '✓ The full suite passed in CI' : '✕ The suite FAILED in CI')
        + (when ? ' — ' + when : '') + (sha ? ' · commit ' + sha : '') + '. ';
      if (/^https:\/\/github\.com\//.test(url)) {
        const a = document.createElement('a');
        a.href = url; a.rel = 'noopener noreferrer';
        a.textContent = 'Open the run for the full scorecard';
        td.appendChild(a);
      }
    })
    .catch(() => { td.textContent = 'Could not reach GitHub to check the latest CI run.'; });
}

/* ── Select-on-focus versus a number field’s spin arrows ──────────────────────
   Clicking a box selects what is in it, which takes cancelling the mouseup —
   that is what would otherwise place the caret and collapse the selection.
   Chrome’s number spinner ALSO ends its press on the mouseup’s default action:
   it repeats while an arrow is held down and stops when the release is allowed
   through. Cancelling it there left ONE click on a down arrow running the value
   all the way to its minimum (found in Flow Metrics, 2026-08-21).

   Press, focus and release are all dispatched by hand, for two reasons: a
   synthetic press never reaches the browser’s own spin button, and focus()
   inside a frame nobody is looking at sets activeElement without firing focusin
   until the frame is focused. So what a real click looks like is not observable
   from here — but the DECISION the guard makes is, and the decision is the part
   that was wrong. The value moving between the press and the release means a
   spin, and a spin has no caret to protect. Same block in every app in the
   family, so it is pinned in every suite. */
function spinProbe(appWin, setUp) {
  const box = appWin.document.createElement('input');
  box.type = 'number'; box.value = '14'; box.min = '1';
  appWin.document.body.appendChild(box);
  try {
    setUp(box);
    const up = new appWin.MouseEvent('mouseup', { bubbles: true, cancelable: true });
    box.dispatchEvent(up);
    return up.defaultPrevented;
  } finally {
    /* Releases the pointer flag as a real release would; without it the next
       probe would inherit a press that never ended. */
    box.dispatchEvent(new appWin.PointerEvent('pointerup', { bubbles: true }));
    box.remove();
  }
}
function spinFocusIn(appWin, el) { el.dispatchEvent(new appWin.FocusEvent('focusin', { bubbles: true })); }
function spinPress(appWin, el)   { el.dispatchEvent(new appWin.PointerEvent('pointerdown', { bubbles: true })); }

group('Select-on-focus versus a number field’s spin arrows');
t('a plain click keeps the select-all — the caret placement is cancelled', () => {
  ok(spinProbe(w, (box) => { spinPress(w, box); spinFocusIn(w, box); }));
});
t('a spin press is let through, so the browser stops repeating on the release', () => {
  eq(spinProbe(w, (box) => { spinPress(w, box); spinFocusIn(w, box); box.value = '13'; }), false);
});
t('a click on the label still selects, exactly as before', () => {
  ok(spinProbe(w, (box) => {
    /* No press on the box of its own to compare against, so the value as it
       stands at focus stands in and that path is left as it was. */
    const lab = w.document.createElement('label');
    w.document.body.appendChild(lab);
    spinPress(w, lab); spinFocusIn(w, box); lab.remove();
  }));
});
t('a focus with no press behind it guards nothing — a Tab has no caret to place', () => {
  eq(spinProbe(w, (box) => { spinFocusIn(w, box); }), false);
});

async function run() {
  w = document.getElementById('app').contentWindow;
  /* A frame that never got the app is a SETUP problem — the folder isn't being
     served, so index.html came back 404 — and without this every test throws
     "Cannot read properties of undefined" in turn, which reads like the app is
     catastrophically broken. Say the one thing that fixes it instead.
     normalizeItem is the sentinel: this page has no hooks object, it calls the
     app's function declarations directly, and that is the first of them. */
  if (!w || typeof w.normalizeItem !== 'function') {
    const s = document.getElementById('summary');
    s.className = 'bad';
    s.textContent = 'The hidden frame never loaded index.html — is this folder being served?';
    document.getElementById('out').innerHTML =
      '<tr><td class="msg" style="white-space:normal;font-family:inherit;font-size:13px">' +
      'Run <code>cd ~/claude-paptrack &amp;&amp; python3 -m http.server 8011</code> and open ' +
      '<code>http://localhost:8011/tests.html</code>.</td></tr>';
    return;
  }
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const item of TESTS) {
    if (item.group) {
      const tr = document.createElement('tr');
      tr.className = 'group';
      tr.innerHTML = '<td colspan="3"></td>';
      tr.firstChild.textContent = item.group;
      out.appendChild(tr);
      continue;
    }
    const tr = document.createElement('tr');
    const st = document.createElement('td'); st.className = 'st';
    const name = document.createElement('td'); name.textContent = item.name;
    const msg = document.createElement('td'); msg.className = 'msg';
    try {
      /* Awaited, so a test may be async — the offline group's first test is,
         because it reads sw.js and index.html off the server. A sync test
         resolves immediately, and running one at a time keeps the rows in
         declaration order either way. */
      await item.fn();
      tr.className = 'pass'; st.textContent = '✓'; pass++;
    } catch (e) {
      tr.className = 'fail'; st.textContent = '✕'; msg.textContent = e.message; fail++;
    }
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
  }
  /* The floor — see EXPECTED at the top of this file. Written as a row of its
     own so it reads like any other failure, and counted into `fail` so the
     summary goes red and CI's `All N tests pass` check does not match. */
  if (pass + fail < EXPECTED) {
    const tr = document.createElement('tr');
    tr.className = 'fail';
    const st = document.createElement('td'); st.className = 'st'; st.textContent = '\u2715';
    const name = document.createElement('td');
    name.textContent = 'the suite ran only ' + (pass + fail) + ' of at least '
      + EXPECTED + ' tests';
    const msg = document.createElement('td'); msg.className = 'msg';
    msg.textContent = 'tests have gone missing rather than failed, so a green result here '
      + 'would cover a fraction of the suite. If they were retired on purpose, lower '
      + 'EXPECTED to match.';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    fail++;
  }
  const s = document.getElementById('summary');
  s.textContent = fail === 0 ? `All ${pass} tests pass` : `${fail} of ${pass + fail} tests FAILED`;
  s.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? '✓ ' : '✕ ') + document.title;
}
</script>
</body>
</html>
